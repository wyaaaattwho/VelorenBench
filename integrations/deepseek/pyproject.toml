[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "velorenbench-official-dsh"
version = "0.1.0"
description = "VelorenBench adapter for the separately installed official DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aiohttp==3.13.3", "rpg-benchmark-harness==1.0.1"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.13"]

[project.scripts]
velorenbench-dsh-bind = "dsh_external_v1.binding:main"

[tool.setuptools]
packages = ["dsh_external_v1"]
include-package-data = false

[tool.setuptools.package-data]
dsh_external_v1 = ["*.mjs", "data/*.json", "data/*.lock"]
